<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspaces</title>
    <link rel="stylesheet" href="../shared/brand.css">
    <link rel="stylesheet" href="../shared/panel.css">
    <link rel="stylesheet" href="sidebar.css">
</head>

<body>
    <div class="sidebar-container">
        <!-- Header -->
        <header class="stage">
            <div class="tool-logo">
                <img src="../icons/icon.svg" alt="" width="22" height="22">
                <h1 class="tl-name">Work<b>spaces</b></h1>
                <a id="link-toco" class="by" href="https://toco.marketing/" target="_blank" rel="noopener noreferrer" title="Visit toco.marketing">by Toco</a>
            </div>
            <button id="btn-new" class="btn-new" title="Create new workspace" aria-label="Create new workspace">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </header>

        <!-- Current Workspace Indicator -->
        <div id="current-workspace-indicator" class="current-workspace-indicator hidden">
            <div class="current-ws-icon"></div>
            <div class="current-ws-info">
                <div class="current-ws-label">Current workspace</div>
                <div class="current-ws-name"></div>
            </div>
        </div>

        <!-- Create workspace panel (hidden by default) -->
        <div id="create-panel" class="create-panel hidden">
            <input type="text" id="input-name" placeholder="Workspace name" autocomplete="off">
            <div class="emoji-picker" id="emoji-picker" role="listbox" aria-label="Workspace emoji"></div>
            <div class="color-picker">
                <button class="color-btn selected" data-color="#048A81" style="background: #048A81" title="Teal"></button>
                <button class="color-btn" data-color="#F5B82E" style="background: #F5B82E" title="Yellow"></button>
                <button class="color-btn" data-color="#FB7185" style="background: #FB7185" title="Rose"></button>
                <button class="color-btn" data-color="#A78BFA" style="background: #A78BFA" title="Violet"></button>
                <button class="color-btn" data-color="#34D399" style="background: #34D399" title="Emerald"></button>
                <button class="color-btn" data-color="#FB923C" style="background: #FB923C" title="Orange"></button>
                <button class="color-btn" data-color="#60A5FA" style="background: #60A5FA" title="Blue"></button>
                <button class="color-btn" data-color="#22D3EE" style="background: #22D3EE" title="Cyan"></button>
            </div>
            <div class="create-options">
                <label>
                    <input type="checkbox" id="from-current" checked>
                    From current window
                </label>
            </div>
            <div class="create-actions">
                <button id="btn-cancel" class="btn-secondary">Cancel</button>
                <button id="btn-create" class="btn-primary">Create</button>
            </div>
        </div>

        <!-- Workspace list -->
        <div id="workspace-list" class="workspace-list">
            <div class="empty-state">
                <p>No workspaces yet</p>
                <p class="hint">Click + to create one</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <a href="#" id="link-settings" class="footer-link">Settings</a>
            <a href="https://buymeacoffee.com/tocomarketing" id="link-coffee" class="footer-link" target="_blank"
                rel="noopener noreferrer">☕ Buy me a coffee</a>
        </footer>
    </div>

    <!-- Include shared modules -->
    <script src="../shared/constants.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="sidebar.js"></script>
</body>

</html>
